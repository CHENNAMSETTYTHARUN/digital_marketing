<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <meta name="theme-color" content="#6366f1">
  <script>if(location.protocol==='file:')location.replace('http://127.0.0.1:5500/signup.html'+location.search+location.hash)</script>
  <script>if(!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("anim")</script>
</head>
<body>
  <div class="auth">
    <main class="auth-main" id="main">
      <a class="logo" href="index.html" aria-label="Stackly home">STACKLY</a>
      <div class="auth-body">
        <h1>Create your account</h1>
        <p class="lead">Get started with a clearer view of your marketing.</p>
        <form class="form" id="signup-form" action="javascript:void(0);" method="post" novalidate>
          <div class="field">
            <label for="full-name">Full name</label>
            <input id="full-name" name="full_name" type="text" placeholder="Enter your full name" autocomplete="name" required minlength="2" maxlength="120" aria-describedby="full-name-error">
            <p class="error" id="full-name-error" role="alert"></p>
          </div>
          <div class="field">
            <label for="signup-email">E-mail</label>
            <input id="signup-email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required aria-describedby="signup-email-error">
            <p class="error" id="signup-email-error" role="alert"></p>
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <div class="input-wrap">
              <input id="signup-password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" required aria-describedby="signup-password-error">
              <button class="toggle-pw" type="button" data-toggle-password="signup-password" aria-pressed="false">Show</button>
            </div>
            <p class="error" id="signup-password-error" role="alert"></p>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <div class="input-wrap">
              <input id="confirm-password" name="confirm_password" type="password" placeholder="Enter your password again" autocomplete="new-password" required aria-describedby="confirm-password-error">
              <button class="toggle-pw" type="button" data-toggle-password="confirm-password" aria-pressed="false">Show</button>
            </div>
            <p class="error" id="confirm-password-error" role="alert"></p>
          </div>
          <p class="form-status" id="signup-status" role="status"></p>
          <button class="btn btn-dark" type="submit">Create Account</button>
        </form>
        <div class="auth-divider"><span>or sign up with</span></div>
        <div class="auth-providers">
          <button class="auth-provider" id="google-login" type="button"><span class="provider-mark google-mark">G</span>Google</button>
          <button class="auth-provider" id="microsoft-login" type="button"><span class="provider-mark microsoft-mark"><i></i><i></i><i></i><i></i></span>Microsoft</button>
        </div>
        <p class="form-status" id="provider-status" role="status"></p>
        <div class="auth-links"><span>Already have an account? <a href="login.html">Sign In</a></span></div>
      </div>
    </main>
    <aside class="auth-aside" aria-hidden="true">
      <div class="hero-bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="grid"></span><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i></div>
      <img class="aside-art" src="images/illus-analytics.svg" alt="" width="900" height="650">
      <div class="aside-card"><h2>Make every campaign count.</h2><p>Create an account to start bringing your marketing into focus.</p><div class="mini"><b style="height:40%"></b><b style="height:55%"></b><b style="height:48%"></b><b style="height:66%"></b><b style="height:60%"></b><b style="height:80%"></b><b style="height:92%"></b></div></div>
    </aside>
  </div>
  <script src="js/main.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/signup.js"></script>
  <script src="js/auth-providers.js"></script>
</body>
</html>
